<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lorem Ipsum Generator</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>
  <div class="tool-page">
    <div class="tool-header">
      <a class="back-link" href="../">← Back</a>
      <h1>Lorem Ipsum Generator</h1>
    </div>

    <label>Number of Paragraphs</label>
    <input id="count" type="number" value="3" min="1" max="20">

    <button id="generate" style="margin-top:15px;">Generate</button>

    <textarea id="output" rows="10" readonly style="margin-top:15px;"></textarea>
  </div>

  <script>
    const base = "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed non risus. Suspendisse lectus tortor, dignissim sit amet, adipiscing nec, ultricies sed, dolor.";

    document.getElementById("generate").onclick = () => {
      const n = parseInt(document.getElementById("count").value);
      let text = "";

      for (let i = 0; i < n; i++) {
        text += base + "\n\n";
      }

      document.getElementById("output").value = text.trim();
    };

    document.getElementById("generate").click();
  </script>
</body>
</html>
