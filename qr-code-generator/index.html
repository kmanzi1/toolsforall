<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QR Code Generator</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>
  <div class="tool-page" style="text-align:center;">
    <div class="tool-header" style="justify-content:center; gap:16px;">
      <a class="back-link" href="../">← Back</a>
      <h1>QR Code Generator</h1>
    </div>

    <input id="text" placeholder="Enter URL or text" style="max-width:420px;">
    <button id="generate" style="margin-top:15px;">Generate QR Code</button>

    <img id="qr" class="qr-img" alt="QR Code">
  </div>

  <script>
    document.getElementById("generate").onclick = () => {
      const value = document.getElementById("text").value.trim();
      if (!value) return alert("Enter text first.");

      const encoded = encodeURIComponent(value);
      document.getElementById("qr").src =
        `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encoded}`;
    };
  </script>
</body>
</html>
