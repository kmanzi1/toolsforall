<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QR Code Generator - Tools for All</title>
  <style>
    body { font-family: Inter, sans-serif; background:#f5f7fa; margin:0; padding:40px; text-align:center; }
    h1 { color:#0a2540; }
    input { width:60%; max-width:400px; padding:8px; }
    button { margin-top:10px; padding:8px 14px; }
    img { margin-top:20px; background:#fff; padding:10px; }
    a { color:#007bff; text-decoration:none; position:absolute; left:40px; top:20px; }
  </style>
</head>
<body>
  <a href="../">← Back to Tools for All</a>
  <h1>QR Code Generator</h1>
  <input id="text" placeholder="Enter URL or text">
  <br>
  <button id="generate">Generate QR Code</button>
  <div>
    <img id="qr" alt="QR Code" />
  </div>

  <script>
    const text = document.getElementById('text');
    const btn = document.getElementById('generate');
    const img = document.getElementById('qr');

    btn.addEventListener('click', () => {
      const value = encodeURIComponent(text.value.trim());
      if (!value) return;
      img.src = 'https://chart.googleapis.com/chart?cht=qr&chs=250x250&chl=' + value;
    });
  </script>
</body>
</html>
