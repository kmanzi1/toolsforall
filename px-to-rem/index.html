<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PX ↔ REM Converter</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>
  <div class="tool-page">
    <div class="tool-header">
      <a class="back-link" href="../">← Back</a>
      <h1>PX ↔ REM Converter</h1>
    </div>

    <label>Base font size (px)</label>
    <input id="base" type="number" value="16">

    <label>Pixels (px)</label>
    <input id="px" type="number">

    <label>REM</label>
    <input id="rem" type="number" step="0.01">
  </div>

  <script>
    const base = document.getElementById("base");
    const px = document.getElementById("px");
    const rem = document.getElementById("rem");

    px.oninput = () => rem.value = (px.value / base.value).toFixed(3);
    rem.oninput = () => px.value = (rem.value * base.value).toFixed(1);
    base.oninput = () => {
      if (px.value) rem.value = (px.value / base.value).toFixed(3);
      if (rem.value) px.value = (rem.value * base.value).toFixed(1);
    };
  </script>
</body>
</html>
