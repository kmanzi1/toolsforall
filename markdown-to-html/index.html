<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Markdown ↔ HTML</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>
  <div class="tool-page">
    <div class="tool-header">
      <a class="back-link" href="../">← Back</a>
      <h1>Markdown ↔ HTML Converter</h1>
    </div>

    <div style="display:flex; gap:20px; flex-wrap:wrap;">
      <div style="flex:1;">
        <h3>Markdown</h3>
        <textarea id="md" rows="12"></textarea>
      </div>

      <div style="flex:1;">
        <h3>HTML</h3>
        <textarea id="html" rows="12"></textarea>
      </div>
    </div>

    <div style="margin-top:15px;">
      <button id="toHtml">Markdown → HTML</button>
      <button id="toMd">HTML → Markdown</button>
    </div>
  </div>

  <script>
    const md = document.getElementById("md");
    const html = document.getElementById("html");

    function mdToHtml(t) {
      return t
        .replace(/^###### (.*)$/gim, "<h6>$1</h6>")
        .replace(/^##### (.*)$/gim, "<h5>$1</h5>")
        .replace(/^#### (.*)$/gim, "<h4>$1</h4>")
        .replace(/^### (.*)$/gim, "<h3>$1</h3>")
        .replace(/^## (.*)$/gim, "<h2>$1</h2>")
        .replace(/^# (.*)$/gim, "<h1>$1</h1>")
        .replace(/\*\*(.*)\*\*/gim, "<b>$1</b>")
        .replace(/\*(.*)\*/gim, "<i>$1</i>")
        .replace(/\n/gim, "<br>");
    }

    function htmlToMd(t) {
      return t
        .replace(/<h1>(.*?)<\/h1>/gim, "# $1\n")
        .replace(/<h2>(.*?)<\/h2>/gim, "## $1\n")
        .replace(/<h3>(.*?)<\/h3>/gim, "### $1\n")
        .replace(/<b>(.*?)<\/b>/gim, "**$1**")
        .replace(/<i>(.*?)<\/i>/gim, "*$1*")
        .replace(/<br\s*\/?>/gim, "\n");
    }

    document.getElementById("toHtml").onclick = () => html
