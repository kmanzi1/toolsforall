<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Word & Character Counter - Tools for All</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="tool-page">
    <div class="tool-header">
      <a href="../" class="back-link">← Back to Tools for All</a>
      <h1>Word & Character Counter</h1>
    </div>

    <textarea id="text" rows="10" placeholder="Start typing or paste your text here..."></textarea>

    <p style="margin-top:12px;">
      Words: <span id="words">0</span> ·
      Characters: <span id="chars">0</span> ·
      Characters (no spaces): <span id="charsNoSpaces">0</span>
    </p>
  </div>

  <script>
    const text = document.getElementById('text');
    const words = document.getElementById('words');
    const chars = document.getElementById('chars');
    const charsNoSpaces = document.getElementById('charsNoSpaces');

    text.addEventListener('input', () => {
      const value = text.value;
      const trimmed = value.trim();
      const wordCount = trimmed ? trimmed.split(/\s+/).length : 0;
      words.textContent = wordCount;
      chars.textContent = value.length;
      charsNoSpaces.textContent = value.replace(/\s/g, '').length;
    });
  </script>
</body>
</html>
