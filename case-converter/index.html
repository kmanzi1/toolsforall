<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Case Converter</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>
  <div class="tool-page">
    <div class="tool-header">
      <a class="back-link" href="../">← Back</a>
      <h1>Case Converter</h1>
    </div>

    <textarea id="text" rows="10" placeholder="Enter text..."></textarea>

    <div style="margin-top:15px;">
      <button data-mode="upper">UPPERCASE</button>
      <button data-mode="lower">lowercase</button>
      <button data-mode="title">Title Case</button>
      <button data-mode="sentence">Sentence case</button>
    </div>
  </div>

  <script>
    const t = document.getElementById("text");

    document.querySelectorAll("button").forEach(btn => {
      btn.onclick = () => {
        let v = t.value;
        const m = btn.dataset.mode;

        if (m === "upper") v = v.toUpperCase();
        if (m === "lower") v = v.toLowerCase();
        if (m === "title") v = v.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
        if (m === "sentence") v = v.toLowerCase().replace(/(^\s*\w|[.!?]\s*\w)/g, c => c.toUpperCase());

        t.value = v;
      };
    });
  </script>
</body>
</html>
