<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Case Converter - Tools for All</title>
  <style>
    body { font-family: Inter, sans-serif; background:#f5f7fa; margin:0; padding:40px; }
    h1 { color:#0a2540; }
    textarea { width:100%; height:200px; padding:10px; }
    button { margin:5px 5px 0 0; padding:6px 12px; }
    a { color:#007bff; text-decoration:none; }
  </style>
</head>
<body>
  <a href="../">← Back to Tools for All</a>
  <h1>Case Converter</h1>
  <textarea id="text" placeholder="Enter text here..."></textarea><br>
  <button data-mode="upper">UPPERCASE</button>
  <button data-mode="lower">lowercase</button>
  <button data-mode="title">Title Case</button>
  <button data-mode="sentence">Sentence case</button>

  <script>
    const text = document.getElementById('text');
    document.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        const mode = btn.getAttribute('data-mode');
        let value = text.value;
        if (mode === 'upper') value = value.toUpperCase();
        if (mode === 'lower') value = value.toLowerCase();
        if (mode === 'title') {
          value = value.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
        }
        if (mode === 'sentence') {
          value = value.toLowerCase().replace(/(^\s*\w|[.!?]\s*\w)/g, c => c.toUpperCase());
        }
        text.value = value;
      });
    });
  </script>
</body>
</html>
