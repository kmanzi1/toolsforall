<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Invoice Generator</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>
  <div class="tool-page">
    <div class="tool-header">
      <a class="back-link" href="../">← Back</a>
      <h1>Invoice Generator</h1>
    </div>

    <label>Client Name</label>
    <input id="client">

    <label>Project Description</label>
    <textarea id="desc" rows="4"></textarea>

    <table id="items">
      <thead>
        <tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr>
      </thead>
      <tbody></tbody>
    </table>

    <button id="add">Add Item</button>
    <button id="download">Download Invoice</button>

    <p id="total" style="margin-top:20px; font-size:1.2rem;">Total: $0.00</p>
  </div>

  <script>
    const tbody = document.querySelector("#items tbody");
    const totalEl = document.getElementById("total");

    function addRow() {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><input class="name"></td>
        <td><input type="number" class="qty" value="1"></td>
        <td><input type="number" class="price" value="0" step="0.01"></td>
        <td class="line">$0.00</td>
      `;
      tbody.appendChild(tr);
      tr.querySelectorAll("input").forEach(i => i.oninput = updateTotals);
      updateTotals();
    }

    function updateTotals() {
      let total = 0;
      tbody.querySelectorAll("tr").forEach(tr => {
        const qty = parseFloat(tr.querySelector(".qty").value) || 0;
        const price = parseFloat(tr.querySelector(".price").value) || 0;
        const line = qty * price;
        tr.querySelector(".line").textContent = "$" + line.toFixed(2);
        total += line;
      });
      totalEl.textContent = "Total: $" + total.toFixed(2);
    }

    document.getElementById("add").onclick = addRow;
    document.getElementById("download").onclick = () => window.print();

    addRow();
  </script>
</body>
</html>
