<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Invoice Generator - Tools for All</title>
  <style>
    body {
      font-family: Inter, sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 40px;
      color: #0a2540;
    }
    h1 { margin-bottom: 20px; }
    label { display: block; margin-top: 10px; font-weight: 600; }
    input, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-size: 1em;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: #fff;
    }
    th, td {
      border: 1px solid #d0d7de;
      padding: 10px;
      text-align: left;
    }
    th {
      background: #e9f1f7;
    }
    button {
      margin-top: 15px;
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      background: #007bff;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #0056b3;
    }
    #total {
      font-weight: bold;
      margin-top: 20px;
      font-size: 1.2em;
    }
    a {
      color: #007bff;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 20px;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <a href="../">← Back to Tools for All</a>
  <h1>Invoice Generator</h1>

  <label>Client Name:<input id="client"></label>
  <label>Project / Description:<textarea id="desc"></textarea></label>

  <table id="items">
    <thead>
      <tr><th>Item</th><th>Qty</th><th>Price</th><th>Line Total</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <button id="add">Add Item</button>
  <button id="download">Download Invoice</button>

  <div id="total">Total: $0.00</div>

  <script>
    const tbody = document.querySelector('#items tbody');
    const totalEl = document.getElementById('total');
    const addBtn = document.getElementById('add');
    const downloadBtn = document.getElementById('download');

    function addRow() {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><input class="name" placeholder="Item name"></td>
        <td><input type="number" class="qty" value="1" min="0"></td>
        <td><input type="number" class="price" value="0" step="0.01" min="0"></td>
        <td class="line">$0.00</td>
      `;
      tbody.appendChild(tr);
      tr.querySelectorAll('input').forEach(i => i.addEventListener('input', updateTotals));
      updateTotals();
    }

    function updateTotals() {
      let total = 0;
      tbody.querySelectorAll('tr').forEach(tr => {
        const qty = parseFloat(tr.querySelector('.qty').value) || 0;
        const price = parseFloat(tr.querySelector('.price').value) || 0;
        const line = qty * price;
        tr.querySelector('.line').textContent = '$' + line.toFixed(2);
        total += line;
      });
      totalEl.textContent = 'Total: $' + total.toFixed(2);
    }

    addBtn.addEventListener('click', addRow);
    addRow();

    downloadBtn.addEventListener('click', () => {
      window.print(); // triggers browser’s print dialog (user can save as PDF)
    });
  </script>
</body>
</html>
