<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Word Counter - Tools for All</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>
  <div class="tool-page">
    <div class="tool-header">
      <a class="back-link" href="../">← Back</a>
      <h1>Word & Character Counter</h1>
    </div>

    <textarea id="text" rows="10" placeholder="Start typing..."></textarea>

    <p style="margin-top:15px;">
      Words: <span id="words">0</span> ·
      Characters: <span id="chars">0</span> ·
      No spaces: <span id="charsNoSpaces">0</span>
    </p>
  </div>

  <script>
    const t = document.getElementById("text");
    const w = document.getElementById("words");
    const c = document.getElementById("chars");
    const ns = document.getElementById("charsNoSpaces");

    t.addEventListener("input", () => {
      const v = t.value;
      w.textContent = v.trim() ? v.trim().split(/\s+/).length : 0;
      c.textContent = v.length;
      ns.textContent = v.replace(/\s/g, "").length;
    });
  </script>
</body>
</html>
