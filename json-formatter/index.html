<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JSON Formatter</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>
  <div class="tool-page">
    <div class="tool-header">
      <a class="back-link" href="../">← Back</a>
      <h1>JSON Formatter</h1>
    </div>

    <textarea id="input" rows="10" placeholder="Paste JSON here..."></textarea>

    <div style="margin-top:15px;">
      <button id="format">Format</button>
      <button id="minify">Minify</button>
    </div>

    <p id="error" style="color:#ef4444; margin-top:10px;"></p>
  </div>

  <script>
    const input = document.getElementById("input");
    const error = document.getElementById("error");

    document.getElementById("format").onclick = () => {
      try {
        error.textContent = "";
        input.value = JSON.stringify(JSON.parse(input.value), null, 2);
      } catch (e) { error.textContent = "Invalid JSON"; }
    };

    document.getElementById("minify").onclick = () => {
      try {
        error.textContent = "";
        input.value = JSON.stringify(JSON.parse(input.value));
      } catch (e) { error.textContent = "Invalid JSON"; }
    };
  </script>
</body>
</html>
