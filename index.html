<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tools for All</title>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, #0f2027, #203a43, #2c5364);
      color: #fff;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      animation: fadeIn 1.5s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      margin-top: 80px;
      font-size: 3.2em;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #00bfff, #00ffcc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: glowPulse 3s ease-in-out infinite alternate;
    }

    @keyframes glowPulse {
      0% { text-shadow: 0 0 10px #00bfff; }
      100% { text-shadow: 0 0 25px #00ffcc; }
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
      padding: 50px;
      width: 90%;
      max-width: 1000px;
      animation: fadeIn 2s ease-in;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 25px;
      text-align: center;
      transition: all 0.3s ease;
      box-shadow: 0 0 0 rgba(0, 191, 255, 0);
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 0 20px rgba(0, 191, 255, 0.4);
      background: rgba(255, 255, 255, 0.08);
    }

    a {
      color: #00bfff;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.1em;
    }

    a:hover {
      color: #00ffcc;
    }
  </style>
</head>
<body>
  <h1>Tools for All</h1>
  <div class="grid">
    <div class="card"><a href="word-counter/">Word & Character Counter</a></div>
    <div class="card"><a href="px-to-rem/">PX ↔ REM Converter</a></div>
    <div class="card"><a href="json-formatter/">JSON Formatter</a></div>
    <div class="card"><a href="case-converter/">Case Converter</a></div>
    <div class="card"><a href="invoice-generator/">Invoice Generator</a></div>
    <div class="card"><a href="markdown-to-html/">Markdown ↔ HTML Converter</a></div>
    <div class="card"><a href="qr-code-generator/">QR Code Generator</a></div>
    <div class="card"><a href="password-generator/">Password Generator</a></div>
    <div class="card"><a href="lorem-ipsum/">Lorem Ipsum Generator</a></div>
    <div class="card"><a href="roi-calculator/">ROI Calculator</a></div>
  </div>
</body>
</html>
