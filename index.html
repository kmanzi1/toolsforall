<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tools for All</title>
  <style>
    body { font-family: Inter, sans-serif; background: #0e0e10; color: #fff; margin: 0; }
    h1 { text-align: center; margin-top: 60px; font-size: 2.5em; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 40px; }
    .card { background: #1a1a1d; border-radius: 10px; padding: 20px; text-align: center; transition: 0.3s; }
    .card:hover { background: #2a2a2f; transform: translateY(-5px); }
    a { color: #00bfff; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Tools for All</h1>
  <div class="grid">
    <div class="card"><a href="word-counter/">Word & Character Counter</a></div>
    <div class="card"><a href="px-to-rem/">PX ↔ REM Converter</a></div>
    <div class="card"><a href="json-formatter/">JSON Formatter</a></div>
    <div class="card"><a href="case-converter/">Case Converter</a></div>
    <div class="card"><a href="invoice-generator/">Invoice Generator</a></div>
    <div class="card"><a href="markdown-to-html/">Markdown ↔ HTML Converter</a></div>
    <div class="card"><a href="qr-code-generator/">QR Code Generator</a></div>
    <div class="card"><a href="password-generator/">Password Generator</a></div>
    <div class="card"><a href="lorem-ipsum/">Lorem Ipsum Generator</a></div>
    <div class="card"><a href="roi-calculator/">ROI Calculator</a></div>
  </div>
</body>
</html>
