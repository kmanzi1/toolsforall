<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ROI Calculator - Tools for All</title>
  <style>
    body { font-family: Inter, sans-serif; background:#f5f7fa; margin:0; padding:40px; }
    h1 { color:#0a2540; }
    label { display:block; margin-top:8px; }
    input { width:150px; padding:6px; }
    button { margin-top:10px; padding:8px 14px; }
    #result { margin-top:15px; font-weight:bold; }
    a { color:#007bff; text-decoration:none; }
  </style>
</head>
<body>
  <a href="../">← Back to Tools for All</a>
  <h1>ROI Calculator</h1>

  <label>Initial Investment:
    <input type="number" id="initial" placeholder="1000">
  </label>
  <label>Final Value:
    <input type="number" id="final" placeholder="1500">
  </label>
  <button id="calc">Calculate ROI</button>

  <div id="result"></div>

  <script>
    const initial = document.getElementById('initial');
    const finalVal = document.getElementById('final');
    const result = document.getElementById('result');
    const btn = document.getElementById('calc');

    btn.addEventListener('click', () => {
      const i = parseFloat(initial.value);
      const f = parseFloat(finalVal.value);
      if (isNaN(i) || isNaN(f) || i === 0) {
        result.textContent = 'Please enter valid numbers (initial cannot be 0).';
        return;
      }
      const roi = ((f - i) / i) * 100;
      result.textContent = 'ROI: ' + roi.toFixed(2) + '%';
    });
  </script>
</body>
</html>
