<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ROI Calculator</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>
  <div class="tool-page">
    <div class="tool-header">
      <a class="back-link" href="../">← Back</a>
      <h1>ROI Calculator</h1>
    </div>

    <label>Initial Investment ($)</label>
    <input id="initial" type="number" placeholder="1000">

    <label>Final Value ($)</label>
    <input id="final" type="number" placeholder="1500">

    <button id="calc" style="margin-top:15px;">Calculate ROI</button>

    <p id="result" style="margin-top:20px; font-size:1.2rem;"></p>
  </div>

  <script>
    document.getElementById("calc").onclick = () => {
      const i = parseFloat(document.getElementById("initial").value);
      const f = parseFloat(document.getElementById("final").value);

      if (isNaN(i) || isNaN(f) || i === 0) {
        document.getElementById("result").textContent = "Enter valid numbers.";
        return;
      }

      const roi = ((f - i) / i) * 100;
      document.getElementById("result").textContent = "ROI: " + roi.toFixed(2) + "%";
    };
  </script>
</body>
</html>
