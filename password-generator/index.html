<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Password Generator</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>
  <div class="tool-page">
    <div class="tool-header">
      <a class="back-link" href="../">← Back</a>
      <h1>Password Generator</h1>
    </div>

    <label>Password Length</label>
    <input id="length" type="number" value="16" min="4" max="64">

    <label><input type="checkbox" id="lower" checked> Lowercase</label>
    <label><input type="checkbox" id="upper" checked> Uppercase</label>
    <label><input type="checkbox" id="numbers" checked> Numbers</label>
    <label><input type="checkbox" id="symbols" checked> Symbols</label>

    <button id="generate" style="margin-top:15px;">Generate Password</button>

    <textarea id="output" rows="3" readonly style="margin-top:15px;"></textarea>
  </div>

  <script>
    const sets = {
      lower: "abcdefghijklmnopqrstuvwxyz",
      upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
      numbers: "0123456789",
      symbols: "!@#$%^&*()-_=+[]{};:,.<>/?"
    };

    document.getElementById("generate").onclick = () => {
      const length = parseInt(document.getElementById("length").value);
      let chars = "";

      if (document.getElementById("lower").checked) chars += sets.lower;
      if (document.getElementById("upper").checked) chars += sets.upper;
      if (document.getElementById("numbers").checked) chars += sets.numbers;
      if (document.getElementById("symbols").checked) chars += sets.symbols;

      if (!chars) {
        document.getElementById("output").value = "Select at least one character set.";
        return;
      }

      let pass = "";
      for (let i = 0; i < length; i++) {
        pass += chars[Math.floor(Math.random() * chars.length)];
      }

      document.getElementById("output").value = pass;
    };
  </script>
</body>
</html>
